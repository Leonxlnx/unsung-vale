<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Unsung Vale: an original third-person fantasy RPG demo, generated entirely by code and rendered in your browser." />
    <title>Unsung Vale</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
      /* Shown before any script has loaded; the real interface takes over afterwards. */
      #boot { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #0b0d10; color: rgba(255, 255, 255, 0.94); font-family: Inter, 'Segoe UI', system-ui, sans-serif; transition: opacity 0.9s; }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot div { width: min(360px, 70vw); }
      #boot h1 { font-size: 28px; font-weight: 400; letter-spacing: -0.02em; margin: 0 0 22px; }
      #boot .bar { height: 1px; background: rgba(255, 255, 255, 0.16); position: relative; overflow: hidden; }
      #boot .bar i { position: absolute; inset: 0; background: #e9c583; transform-origin: left; transform: scaleX(0.02); transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1); }
      #boot p { margin: 14px 0 0; font-size: 13px; color: rgba(255, 255, 255, 0.62); }
    </style>
  </head>
  <body>
    <canvas id="view" tabindex="0"></canvas>
    <div id="boot"><div><h1>Unsung Vale</h1><div class="bar"><i></i></div><p>Preparing the valley</p></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
